<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rahul Tanwar Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f4;
      --surface: #ffffff;
      --surface2: #f7f7f6;
      --border: rgba(0,0,0,0.08);
      --border-md: rgba(0,0,0,0.14);
      --text: #18181b;
      --text2: #71717a;
      --text3: #a1a1aa;
      --purple-bg: #EEEDFE;
      --purple: #534AB7;
      --purple-dark: #3C3489;
      --purple-border: #AFA9EC;
      --green: #0F6E56;
      --red-bg: #FCEBEB;
      --red: #A32D2D;
      --gray-bg: #F1EFE8;
      --gray: #5F5E5A;
      --r-md: 8px;
      --r-lg: 12px;
      --r-xl: 16px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
    }

    [data-theme="dark"] {
      --bg: #0f0f11;
      --surface: #1a1a1e;
      --surface2: #222228;
      --border: rgba(255,255,255,0.07);
      --border-md: rgba(255,255,255,0.13);
      --text: #f4f4f5;
      --text2: #a1a1aa;
      --text3: #52525b;
      --purple-bg: #1e1b3a;
      --purple: #8b82e8;
      --purple-dark: #a39af0;
      --purple-border: #4a4280;
      --green: #1D9E75;
      --red-bg: #2a1111;
      --red: #f09595;
      --gray-bg: #1e1e1e;
      --gray: #888780;
      --shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
      padding: 2rem 1.25rem;
    }

    #root { width: 100%; max-width: 900px; margin: 0 auto; }
    .page { display: none; }
    .page.active { display: block; }

    /* ── Login ── */
    .login-wrap { display: flex; justify-content: center; padding: 4rem 0 2rem; }
    .login-card { background: var(--surface); border: 0.5px solid var(--border-md); border-radius: var(--r-xl); padding: 2.25rem; width: 100%; max-width: 370px; box-shadow: var(--shadow); }
    .login-theme-row { display: flex; justify-content: flex-end; margin-bottom: 1.5rem; }
    .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
    .login-brand-icon { width: 40px; height: 40px; background: var(--purple-bg); border-radius: var(--r-lg); display: flex; align-items: center; justify-content: center; }
    .login-brand-icon i { font-size: 20px; color: var(--purple); }
    .login-brand-name { font-size: 16px; font-weight: 500; }
    .login-heading { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: var(--text2); margin-bottom: 1.75rem; }

    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .field label { font-size: 12px; color: var(--text2); font-weight: 500; }
    .field input { font-size: 13px; padding: 10px 12px; border: 0.5px solid var(--border-md); border-radius: var(--r-md); background: var(--surface2); color: var(--text); outline: none; font-family: inherit; width: 100%; transition: border-color 0.15s; }
    .field input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(83,74,183,0.12); }

    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 40px; }
    .pw-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; color: var(--text3); display: flex; align-items: center; }
    .pw-toggle i { font-size: 16px; }

    .login-btn { width: 100%; padding: 10px; background: var(--purple); color: #fff; border: none; border-radius: var(--r-md); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; margin-top: 4px; transition: background 0.15s, transform 0.1s; }
    .login-btn:hover { background: var(--purple-dark); }
    .login-btn:active { transform: scale(0.98); }
    .err-msg { font-size: 12px; color: var(--red); margin-top: 10px; min-height: 18px; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--r-md); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; border: 0.5px solid var(--border-md); background: var(--surface); color: var(--text); transition: background 0.12s; }
    .btn:hover { background: var(--surface2); }
    .btn.ghost { background: transparent; border-color: var(--border); color: var(--text2); }
    .btn.ghost:hover { background: var(--surface2); color: var(--text); }

    .icon-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: var(--r-md); border: none; background: transparent; cursor: pointer; color: var(--text2); transition: background 0.12s, color 0.12s; }
    .icon-btn:hover { background: var(--surface2); color: var(--text); }
    .icon-btn i { font-size: 16px; }

    .theme-toggle { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: var(--r-md); border: 0.5px solid var(--border-md); background: var(--surface); cursor: pointer; color: var(--text2); transition: background 0.12s; }
    .theme-toggle:hover { background: var(--surface2); color: var(--text); }
    .theme-toggle i { font-size: 16px; }

    /* ── Header ── */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .header-brand-icon { width: 36px; height: 36px; background: var(--purple-bg); border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .header-brand-icon i { font-size: 18px; color: var(--purple); }
    .header-title { font-size: 18px; font-weight: 600; }
    .header-sub { font-size: 12px; color: var(--text2); }
    .hdr-actions { display: flex; gap: 8px; align-items: center; }

    /* ── Stats ── */
    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
    .stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r-lg); padding: 12px 14px; }
    .stat-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
    .stat-val { font-size: 22px; font-weight: 500; color: var(--text); }

    /* ── Toolbar ── */
    .toolbar { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
    .search-bar { display: flex; align-items: center; gap: 8px; border: 0.5px solid var(--border-md); border-radius: var(--r-md); padding: 8px 12px; background: var(--surface); flex: 1; min-width: 180px; }
    .search-bar i { font-size: 16px; color: var(--text3); flex-shrink: 0; }
    .search-bar input { border: none; background: transparent; font-size: 13px; color: var(--text); width: 100%; outline: none; font-family: inherit; }
    .sort-select { font-size: 12px; padding: 8px 12px; border: 0.5px solid var(--border-md); border-radius: var(--r-md); background: var(--surface); color: var(--text); outline: none; cursor: pointer; font-family: inherit; }

    /* ── Tag filters ── */
    .tag-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
    .tag-chip { padding: 4px 11px; border-radius: 99px; font-size: 12px; border: 0.5px solid var(--border); background: var(--surface2); color: var(--text2); cursor: pointer; transition: all 0.12s; font-family: inherit; }
    .tag-chip.active { background: var(--purple-bg); color: var(--purple-dark); border-color: var(--purple-border); }
    .count-badge { font-size: 12px; color: var(--text3); margin-bottom: 0.75rem; }

    /* ── Cards ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r-lg); padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 10px; transition: border-color 0.15s, box-shadow 0.15s; }
    .card:hover { border-color: var(--border-md); box-shadow: var(--shadow); }
    .card-top { display: flex; align-items: flex-start; gap: 10px; }
    .card-icon { width: 36px; height: 36px; border-radius: var(--r-md); background: var(--purple-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .card-icon i { font-size: 18px; color: var(--purple); }
    .card-meta { flex: 1; min-width: 0; }
    .card-sn { font-size: 10px; color: var(--text3); font-weight: 600; letter-spacing: 0.04em; margin-bottom: 2px; }
    .card-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .card-actions { display: flex; gap: 2px; margin-left: auto; }
    .card-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }
    .card-tags { display: flex; gap: 5px; flex-wrap: wrap; }
    .tag { padding: 3px 9px; border-radius: 99px; font-size: 11px; background: var(--gray-bg); color: var(--gray); }
    .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 0.5px solid var(--border); }
    .open-link { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--purple); text-decoration: none; font-weight: 500; }
    .open-link:hover { text-decoration: underline; }
    .open-link i { font-size: 14px; }
    .copied-toast { font-size: 11px; color: var(--green); }

    /* ── Loading / Error states ── */
    .state-box { display: flex; flex-direction: column; align-items: center; padding: 3.5rem 1rem; color: var(--text3); gap: 10px; grid-column: 1 / -1; }
    .state-box i { font-size: 44px; opacity: 0.35; }
    .state-box p { font-size: 14px; text-align: center; }
    .state-box.error i, .state-box.error p { color: var(--red); opacity: 1; }
    .state-box .spinner { width: 28px; height: 28px; border: 2.5px solid var(--border-md); border-top-color: var(--purple); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Refresh button ── */
    .refresh-row { display: flex; justify-content: flex-end; margin-bottom: 0.75rem; }

    @media (max-width: 600px) {
      body { padding: 1rem 0.75rem; }
      .header { flex-direction: column; align-items: flex-start; }
      .hdr-actions { width: 100%; justify-content: flex-end; }
      .stats-bar { grid-template-columns: 1fr 1fr; }
      .login-card { padding: 1.5rem; }
    }
  </style>
</head>
<body>
<div id="root">

  <!-- LOGIN -->
  <div id="login-page" class="page active">
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-theme-row">
          <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
            <i class="ti ti-moon" id="theme-icon-login"></i>
          </button>
        </div>
        <div class="login-brand">
          <div class="login-brand-icon"><i class="ti ti-pencil"></i></div>
          <span class="login-brand-name">Rahul Tanwar Notes</span>
        </div>
        <div class="login-heading">Welcome back</div>
        <div class="login-sub">Sign in to access your diagrams</div>
        <div class="field">
          <label for="l-user">Username</label>
          <input type="text" id="l-user" placeholder="Username" autocomplete="username" />
        </div>
        <div class="field">
          <label for="l-pass">Password</label>
          <div class="pw-wrap">
            <input type="password" id="l-pass" placeholder="Password" autocomplete="current-password" />
            <button class="pw-toggle" onclick="togglePw()" type="button" aria-label="Show password">
              <i class="ti ti-eye" id="pw-icon"></i>
            </button>
          </div>
        </div>
        <button class="login-btn" onclick="doLogin()">Sign in</button>
        <div class="err-msg" id="l-err"></div>
      </div>
    </div>
  </div>

  <!-- VAULT -->
  <div id="vault-page" class="page">
    <div class="header">
      <div class="header-brand">
        <div class="header-brand-icon"><i class="ti ti-pencil"></i></div>
        <div>
          <div class="header-title">Rahul Tanwar Notes</div>
          <div class="header-sub">Your private note-taking space</div>
        </div>
      </div>
      <div class="hdr-actions">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
          <i class="ti ti-moon" id="theme-icon-vault"></i>
        </button>
        <button class="btn" onclick="loadFromTxt()" title="Reload vault_data.txt"><i class="ti ti-refresh"></i> Refresh</button>
        <button class="btn ghost" onclick="doLogout()"><i class="ti ti-logout"></i> Sign out</button>
      </div>
    </div>

    <div class="stats-bar" id="stats-bar"></div>

    <div class="toolbar">
      <div class="search-bar">
        <i class="ti ti-search"></i>
        <input type="text" id="search-input" placeholder="Search by name, tag, or description…" oninput="renderCards()" />
      </div>
      <select class="sort-select" id="sort-select" onchange="renderCards()">
        <option value="sn">Serial order</option>
        <option value="alpha">A → Z</option>
      </select>
    </div>

    <div class="tag-filters" id="tag-filters"></div>
    <div class="count-badge" id="count-badge"></div>
    <div class="grid" id="cards-grid">
      <div class="state-box" style="grid-column:1/-1">
        <div class="spinner"></div>
        <p>Loading diagrams…</p>
      </div>
    </div>
  </div>

</div>
<script>
  let allDiagrams = [];
  let activeTag = 'all';
  let isDark = false;

  // ── Theme ──────────────────────────────────────────────────
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : '');
    ['theme-icon-login','theme-icon-vault'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.className = isDark ? 'ti ti-sun' : 'ti ti-moon';
    });
  }
  function toggleTheme() {
    isDark = !isDark;
    applyTheme();
    localStorage.setItem('excalidraw-vault-theme', isDark ? 'dark' : 'light');
  }
  function loadTheme() {
    isDark = localStorage.getItem('excalidraw-vault-theme') === 'dark';
    applyTheme();
  }

  // ── Login ──────────────────────────────────────────────────
  function getToday() {
    const d = new Date();
    return String(d.getDate()).padStart(2,'0') + String(d.getMonth()+1).padStart(2,'0') + d.getFullYear();
  }
  function togglePw() {
    const inp = document.getElementById('l-pass'), ic = document.getElementById('pw-icon');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    ic.className = inp.type === 'password' ? 'ti ti-eye' : 'ti ti-eye-off';
  }
  function doLogin() {
    const user = document.getElementById('l-user').value.trim();
    const pass = document.getElementById('l-pass').value.trim();
    const errEl = document.getElementById('l-err');
    if (user !== 'whocares' || pass !== getToday()) {
      errEl.textContent = 'Incorrect username or password.';
      document.getElementById('l-pass').value = '';
      document.getElementById('l-pass').focus();
      return;
    }
    errEl.textContent = '';
    document.getElementById('login-page').classList.remove('active');
    document.getElementById('vault-page').classList.add('active');
    loadFromTxt();
  }
  function doLogout() {
    document.getElementById('vault-page').classList.remove('active');
    document.getElementById('login-page').classList.add('active');
    ['l-user','l-pass'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('l-pass').type = 'password';
    document.getElementById('pw-icon').className = 'ti ti-eye';
    document.getElementById('l-err').textContent = '';
    const si = document.getElementById('search-input');
    if (si) si.value = '';
    activeTag = 'all';
    allDiagrams = [];
  }
  document.getElementById('l-user').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('l-pass').focus(); });
  document.getElementById('l-pass').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });

  // ── Parse vault_data.txt ───────────────────────────────────
  function parseTxt(text) {
    const rows = [];
    for (const raw of text.split('\n')) {
      const line = raw.trim();
      if (!line || line.startsWith('#')) continue;
      const parts = line.split('|').map(p => p.trim());
      if (parts.length < 5) continue;
      const [sn, name, url, description, tagsRaw] = parts;
      if (!sn || !name || !url) continue;
      const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
      rows.push({ sn, name, url, description: description || '', tags });
    }
    return rows;
  }

  // ── Fetch vault_data.txt (relative, works on GitHub Pages) ─
  async function loadFromTxt() {
    const grid = document.getElementById('cards-grid');
    grid.innerHTML = `<div class="state-box" style="grid-column:1/-1"><div class="spinner"></div><p>Loading diagrams…</p></div>`;

    try {
      // Cache-bust so refreshing always gets the latest file from the server
      const res = await fetch('vault_data.txt?_=' + Date.now());
      if (!res.ok) throw new Error(`HTTP ${res.status} — vault_data.txt not found`);
      const text = await res.text();
      allDiagrams = parseTxt(text);
      if (!allDiagrams.length) throw new Error('vault_data.txt has no valid rows yet.');
      activeTag = 'all';
      document.getElementById('search-input').value = '';
      renderCards();
    } catch (err) {
      allDiagrams = [];
      renderStats();
      grid.innerHTML = `
        <div class="state-box error" style="grid-column:1/-1">
          <i class="ti ti-alert-circle"></i>
          <p><strong>Could not load vault_data.txt</strong><br>${err.message}</p>
        </div>`;
    }
  }

  // ── Render ─────────────────────────────────────────────────
  function allTags() {
    const s = new Set();
    allDiagrams.forEach(d => d.tags.forEach(t => s.add(t)));
    return [...s].sort();
  }

  function getSorted(arr) {
    const mode = document.getElementById('sort-select').value;
    const copy = [...arr];
    if (mode === 'alpha') return copy.sort((a,b) => a.name.localeCompare(b.name));
    // default: serial number order (as they appear in file)
    return copy;
  }

  function renderStats() {
    document.getElementById('stats-bar').innerHTML = `
      <div class="stat-card"><div class="stat-label">Total diagrams</div><div class="stat-val">${allDiagrams.length}</div></div>
      <div class="stat-card"><div class="stat-label">Tags</div><div class="stat-val">${allTags().length}</div></div>`;
  }

  function renderCards() {
    renderStats();
    const q = (document.getElementById('search-input').value || '').toLowerCase();

    // Tag filter chips
    const tf = document.getElementById('tag-filters');
    tf.innerHTML = '';
    ['all', ...allTags()].forEach(t => {
      const chip = document.createElement('button');
      chip.className = 'tag-chip' + (activeTag === t ? ' active' : '');
      chip.textContent = t === 'all' ? 'All' : '#' + t;
      chip.onclick = () => { activeTag = t; renderCards(); };
      tf.appendChild(chip);
    });

    let filtered = getSorted(allDiagrams.filter(d => {
      const mq = !q
        || d.name.toLowerCase().includes(q)
        || d.description.toLowerCase().includes(q)
        || d.tags.some(t => t.includes(q));
      const mt = activeTag === 'all' || d.tags.includes(activeTag);
      return mq && mt;
    }));

    document.getElementById('count-badge').textContent =
      filtered.length + ' diagram' + (filtered.length !== 1 ? 's' : '');

    const grid = document.getElementById('cards-grid');
    if (!filtered.length) {
      grid.innerHTML = `<div class="state-box" style="grid-column:1/-1"><i class="ti ti-layout-grid-remove"></i><p>No diagrams match your search.</p></div>`;
      return;
    }

    grid.innerHTML = '';
    filtered.forEach(d => {
      const card = document.createElement('div');
      card.className = 'card';
      const tagsHtml = d.tags.map(t => `<span class="tag">#${t}</span>`).join('');
      card.innerHTML = `
        <div class="card-top">
          <div class="card-icon"><i class="ti ti-vector-triangle"></i></div>
          <div class="card-meta">
            <div class="card-sn">SN #${d.sn}</div>
            <div class="card-name" title="${d.name}">${d.name}</div>
          </div>
          <div class="card-actions">
            <button class="icon-btn" title="Copy link" onclick="copyUrl(this, '${d.sn}')"><i class="ti ti-copy"></i></button>
          </div>
        </div>
        ${d.description ? `<div class="card-desc">${d.description}</div>` : ''}
        ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
        <div class="card-footer">
          <a class="open-link" href="${d.url}" target="_blank" rel="noopener noreferrer">
            <i class="ti ti-external-link"></i> Open in Excalidraw
          </a>
          <span class="copied-toast" id="toast-${d.sn}"></span>
        </div>`;
      grid.appendChild(card);
    });
  }

  async function copyUrl(btn, sn) {
    const d = allDiagrams.find(x => x.sn === sn);
    if (!d) return;
    try {
      await navigator.clipboard.writeText(d.url);
      const t = document.getElementById('toast-' + sn);
      if (t) { t.textContent = 'Copied!'; setTimeout(() => { t.textContent = ''; }, 1800); }
    } catch(_) {}
  }

  loadTheme();
</script>
</body>
</html>
